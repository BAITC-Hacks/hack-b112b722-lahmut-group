  <text x="52" y="220" fill="#95edd8" font-family="Arial, sans-serif" font-size="47" font-weight="700">в проверенный протокол.</text>
  <text x="54" y="267" fill="#b8cfd8" font-family="Arial, sans-serif" font-size="18">Кто отвечает. Что сделать. На каком основании.</text>
